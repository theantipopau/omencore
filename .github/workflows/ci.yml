name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "OmenCore.sln"

      - name: Build
        run: dotnet build "OmenCore.sln" -c Debug --no-restore

      - name: Run tests
        env:
          OMENCORE_DISABLE_FILE_LOG: '1'
        run: |
          dotnet test "OmenCore.sln" -c Debug --no-build --logger "console;verbosity=normal"

  wmi-v2-tests:
    name: WMI V2 focused tests (unit)
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore & Build
        run: |
          dotnet restore "OmenCore.sln"
          dotnet build "OmenCore.sln" -c Debug --no-restore
      - name: Run WMI-V2 tests
        env:
          OMENCORE_DISABLE_FILE_LOG: '1'
        run: |
          dotnet test "OmenCore.sln" -c Debug --no-build --filter "FullyQualifiedName~WmiV2VerificationTests|FullyQualifiedName~HpWmiBiosRpmParsingTests" --logger "console;verbosity=minimal"

  integration-tests:
    name: Integration tests (quick-profile stress + diagnostics E2E)
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore & Build
        run: |
          dotnet restore "OmenCore.sln"
          dotnet build "OmenCore.sln" -c Debug --no-restore
      - name: Run integration tests
        env:
          OMENCORE_DISABLE_FILE_LOG: '1'
        run: |
          dotnet test "OmenCore.sln" -c Debug --no-build --filter "FullyQualifiedName~FanSmoothingTests.QuickProfileSwitching_Stress_LongRun|FullyQualifiedName~ModelReportServiceTests.CreateModelDiagnosticBundleAsync_CreatesZipAndReturnsPath|FullyQualifiedName~FanControllerEcWatchdogTests|FullyQualifiedName~FanControllerEcRateTests" --logger "console;verbosity=minimal"

  model-database-submissions:
    name: Validate community model-database submissions
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a newer image on 2026-10-19; move on purpose after a CI check
    steps:
      - uses: actions/checkout@v7
      - name: Validate any submitted model JSON files
        run: |
          shopt -s nullglob
          files=(docs/model-database/submissions/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No submission files present, nothing to validate."
            exit 0
          fi
          status=0
          for f in "${files[@]}"; do
            echo "Validating $f"
            python3 docs/model-database/validate_model_submission.py "$f" \
              --existing-db src/OmenCore.Core/Hardware/ModelCapabilityDatabase.cs || status=1
          done
          exit $status

  portable-size-budget:
    name: Portable build + size budget
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # Roadmap WP-46: the download size is a promise to the user, so it is measured on every
      # push instead of being quoted in a README and quietly drifting.
      - name: Publish portable build and enforce the size budget
        shell: pwsh
        run: ./qa/check-size-budget.ps1

  startup-memory-budget:
    name: Startup + idle memory budget
    runs-on: windows-latest
    # The gate launches the app twice and samples for 45 s each time. Without a bound, a runner
    # where the app cannot start at all would sit on the default 6-hour timeout before anyone
    # learned why.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      # Roadmap WP-31 follow-up. Startup time and idle footprint were only ever checked by hand,
      # so a regression shipped and surfaced as a user report. This launches the Release build,
      # measures a real startup timeline and idle footprint, and fails past qa/memory-budget.json.
      - name: Measure a real launch and enforce the startup/memory budget
        shell: pwsh
        run: ./qa/check-memory-budget.ps1
