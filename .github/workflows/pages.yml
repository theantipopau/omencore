name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the wait step lists this run's artifacts

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to a newer image on 2026-10-19; move on purpose after a CI check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      # deploy-pages lists the run's artifacts once and fails on an empty list. Right after the upload the
      # listing can still be empty (the 5.0.2 site deploy failed this way twice). Wait until it is listed.
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$n" -ge 1 ]; then echo "github-pages listed (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "::error::the github-pages artifact never appeared in this run's artifact listing"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
