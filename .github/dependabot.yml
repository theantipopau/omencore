# Weekly update PRs, grouped so one week is one PR per ecosystem. The full CI suite (release-gate tests included) is
# the safety net; nothing merges on its own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major versions are taken on purpose in a release cycle, not as weekly PRs (several also target newer
      # .NET than the net8.0 the app ships on).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The CLI is written against the 2.0.0-beta4 API (AddCommand/AddOption/SetHandler), which the stable
      # releases removed. Remove this once omencore-cli is ported to the stable API.
      - dependency-name: System.CommandLine

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
